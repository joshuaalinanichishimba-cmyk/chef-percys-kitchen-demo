services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: percy
      POSTGRES_PASSWORD: percy-local-only
      POSTGRES_DB: percy
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "percy", "-d", "percy"]
      interval: 2s
      timeout: 3s
      retries: 10
volumes:
  database:
