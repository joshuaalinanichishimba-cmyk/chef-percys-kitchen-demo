<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu management | Chèf Percy’s Kitchen</title>
<link rel="stylesheet" href="/owner/assets/dashboard.css">
<script type="module" src="/owner/assets/dashboard.js"></script>
<script type="module" src="/owner/assets/bookings.js"></script>
</head>
<body>
<main>
  <header><p>CHÈF PERCY’S KITCHEN · OWNER</p><h1>Menu management</h1></header>
  <p id="status" role="status"></p>
  <section class="order-queue" aria-labelledby="capacity-title">
    <h2 id="capacity-title">Daily order limit</h2>
    <form id="capacity">
      <label>Maximum requests per Kitwe day
        <input name="daily_limit" type="number" min="1" max="10000" step="1" placeholder="Unlimited">
      </label>
      <p id="capacity-status" role="status"></p>
      <button type="submit">Save limit</button>
    </form>
  </section>
  <section class="order-queue" aria-labelledby="orders-title">
    <h2 id="orders-title">Recent order requests</h2>
    <button id="refresh-orders" type="button">Refresh orders</button>
    <p id="orders-status" role="status"></p>
    <ul id="orders"></ul>
  </section>
  <section class="order-queue" aria-labelledby="bookings-title">
    <h2 id="bookings-title">Catering inquiries and bookings</h2>
    <button id="refresh-bookings" type="button">Refresh inquiries</button>
    <p id="bookings-status" role="status"></p>
    <ul id="bookings"></ul>
  </section>
  <section class="order-queue" aria-labelledby="payments-title">
    <h2 id="payments-title">Verified payments</h2>
    <p>Check the transaction against the actual payment record before saving it.</p>
    <form id="record-payment">
      <label>Payment for <select name="target"><option value="orders">Food order</option><option value="catering">Catering</option></select></label>
      <label>Order or catering reference <input name="reference" maxlength="36" required></label>
      <button id="lookup-payments" type="button">View recorded payments</button>
      <label>Channel <select name="channel">
        <option value="airtel">Airtel Money</option><option value="mtn">MTN MoMo</option>
        <option value="cash">Cash receipt</option><option value="bank">Bank transfer</option>
      </select></label>
      <label>Transaction or receipt reference <input name="transaction_reference" maxlength="80" required></label>
      <label>Amount (K) <input name="amount" type="number" min="0.01" max="1000000" step="0.01" required></label>
      <label><input name="verified" type="checkbox" required> I verified that this payment was received</label>
      <button type="submit">Record verified payment</button>
    </form>
    <p id="payment-status" role="status"></p>
    <ul id="payment-list"></ul>
  </section>
  <div class="layout">
    <section aria-labelledby="entries-title">
      <h2 id="entries-title">Menu entries</h2>
      <button id="new-entry" type="button">New entry</button>
      <ul id="entries"></ul>
    </section>
    <form id="editor" hidden>
      <h2 id="form-title">New entry</h2>
      <label>Category <input name="category" maxlength="80" required></label>
      <label>Item name <input name="name" maxlength="120" required></label>
      <label>Option or portion <input name="option" maxlength="120"></label>
      <label>Description <textarea name="description" maxlength="400"></textarea></label>
      <label>Price (K) <input name="price_ngwee" type="number" min="0.01" max="1000000" step="0.01" required></label>
      <label>Upper price for a range (K) <input name="max_price_ngwee" type="number" min="0.01" max="1000000" step="0.01"></label>
      <label><input name="starting_at" type="checkbox"> Display as a starting price</label>
      <label><input name="available" type="checkbox" checked> Show on customer menu</label>
      <button type="submit">Save entry</button>
    </form>
  </div>
</main>
</body>
</html>
